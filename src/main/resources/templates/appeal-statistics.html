<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>RepWrite - Appeal Statistics</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
            --border: #334155;
            --accent: #c084fc;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .header {
            margin-bottom: 3rem;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
        }

        p.description {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 2rem;
            border-radius: 1.25rem;
            border: 1px solid var(--border);
            transition: transform 0.2s, border-color 0.2s;
            text-align: center;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 0.5rem;
            font-family: 'Fira Code', monospace;
        }

        .stat-label {
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.1em;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 1rem;
        }

        th, td {
            text-align: left;
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .count-badge {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            font-weight: 700;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .refresh-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            float: right;
        }

        .refresh-btn:hover {
            color: var(--text);
            border-color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1>Impact Dashboard</h1>
            <p class="description">Live statistics from RepWrite's cached advocacy efforts.</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalAppeals">-</div>
                <div class="stat-label">Total Appeals Generated</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="uniqueNames">-</div>
                <div class="stat-label">Unique Supporters</div>
            </div>
        </div>

        <div class="section-title">
            Appeals by Issue
            <button class="refresh-btn" onclick="fetchStats()">Refresh Data</button>
        </div>

        <table id="statsTable">
            <thead>
                <tr>
                    <th>Issue Name</th>
                    <th>Issue ID</th>
                    <th style="text-align: right;">Generated Appeals</th>
                </tr>
            </thead>
            <tbody id="statsBody">
                <!-- Data will be injected here -->
            </tbody>
        </table>
    </div>

    <script>
        const totalAppealsEl = document.getElementById('totalAppeals');
        const uniqueNamesEl = document.getElementById('uniqueNames');
        const statsBody = document.getElementById('statsBody');
        const loadingOverlay = document.getElementById('loading');

        async function fetchStats() {
            try {
                const response = await fetch('/api/statistics');
                if (!response.ok) throw new Error('Failed to fetch statistics');
                const data = await response.json();
                
                animateValue(totalAppealsEl, 0, data.totalAppeals, 1000);
                animateValue(uniqueNamesEl, 0, data.uniqueNames, 1000);
                
                displayIssueStats(data.issueStats);
            } catch (error) {
                console.error('Error:', error);
                statsBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--error);">Failed to load statistics.</td></tr>';
            } finally {
                setTimeout(() => {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => loadingOverlay.style.display = 'none', 500);
                }, 500);
            }
        }

        function displayIssueStats(issueStats) {
            statsBody.innerHTML = '';
            if (issueStats.length === 0) {
                statsBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">No appeals recorded yet.</td></tr>';
                return;
            }

            issueStats.forEach(stat => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight: 600; color: var(--text);">${stat.causeName}</td>
                    <td style="font-family: 'Fira Code', monospace; font-size: 0.8rem; color: var(--text-muted);">${stat.causeId}</td>
                    <td style="text-align: right;"><span class="count-badge">${stat.count}</span></td>
                `;
                statsBody.appendChild(row);
            });
        }

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // Initial fetch
        fetchStats();
    </script>
</body>
</html>
